{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="register-page">

    <div class="register-card">

        <div class="register-icon">
            👤
        </div>

        <h1>Create Your Account</h1>

        <p class="register-intro">
            Join our event community and start discovering amazing events.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="register-button">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>

</div>


<style>

    .register-page {
        display: flex;
        justify-content: center;
        padding: 35px 0;
    }

    .register-card {
        width: 100%;
        max-width: 520px;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
    }

    .register-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #e0f2fe;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    .register-card h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #1f2937;
    }

    .register-intro {
        text-align: center;
        color: #666;
        line-height: 1.5;
        margin-bottom: 30px;
    }

    /* Form */

    .register-card input {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .register-card input:focus {
        outline: none;
        border-color: #2563eb;
    }

    .register-card label {
        font-weight: bold;
        color: #374151;
    }

    .register-card ul.helptext,
    .register-card .helptext {
        color: #777;
        font-size: 13px;
    }

    .errorlist {
        color: #dc2626;
        font-size: 14px;
        padding-left: 0;
        list-style: none;
    }

    /* Register button */

    .register-button {
        width: 100%;
        padding: 13px;
        margin-top: 15px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .register-button:hover {
        background: #15803d;
    }

    /* Login link */

    .login-link {
        text-align: center;
        margin-top: 25px;
        color: #666;
    }

    .login-link a {
        color: #2563eb;
        font-weight: bold;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {

        .register-card {
            padding: 30px 20px;
        }

    }

</style>

{% endblock %}
