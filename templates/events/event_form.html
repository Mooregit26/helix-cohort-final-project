{% extends 'base.html' %}

{% block title %}Create Event{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Create a New Event</h1>

        <p class="form-intro">
            Fill in the information below to create and publish your event.
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="create-event-button">
                Create Event
            </button>

        </form>

    </div>

</div>


<style>

    .form-page {
        display: flex;
        justify-content: center;
        padding: 30px 0;
    }

    .form-card {
        width: 100%;
        max-width: 700px;
        background: #ffffff;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .form-card h1 {
        margin-top: 0;
        text-align: center;
        font-size: 32px;
    }

    .form-intro {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    /* Form fields */

    .form-card input,
    .form-card textarea,
    .form-card select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .form-card textarea {
        min-height: 120px;
        resize: vertical;
    }

    .form-card input:focus,
    .form-card textarea:focus,
    .form-card select:focus {
        outline: none;
        border-color: #2563eb;
    }

    .form-card label {
        font-weight: bold;
        color: #374151;
    }

    /* Button */

    .create-event-button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .create-event-button:hover {
        background: #15803d;
    }

    /* Error messages */

    .errorlist {
        color: #dc2626;
        list-style: none;
        padding-left: 0;
        margin-top: 5px;
    }

    @media (max-width: 600px) {

        .form-card {
            padding: 25px 20px;
        }

    }

</style>

{% endblock %}
